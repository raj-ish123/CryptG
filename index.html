<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cryptogram Generator</title>
  <style>
    body {
      font-family: monospace;
      background-color: #f4f4f9;
      margin: 20px;
    }
    .container {
      max-width: 100%;
      overflow-x: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    input, button {
      width: calc(100% - 22px);
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    button.header-btn {
      width: auto;
      flex-shrink: 0;
      margin-bottom: 0;
      white-space: nowrap;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .page-header h1 {
      margin: 0;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      flex: 1;
      min-width: 0;
    }
    .generator-panel.hidden {
      display: none;
    }
    .sheet-panel.hidden {
      display: none;
    }
    .sheet-panel:not(.hidden) #sheetEmbed {
      height: calc(100vh - 88px);
      min-height: 400px;
    }
    .container.container--sheet-focus {
      min-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
    }
    .container.container--sheet-focus .sheet-panel:not(.hidden) {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .container.container--sheet-focus #sheetEmbed {
      flex: 1;
      min-height: 0;
      height: auto;
    }
    .output {
      margin-top: 20px;
    }
    .cryptogram, .answer, .key {
      background-color: #f9f9f9;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
      overflow-x: auto;
      white-space: pre;
    }
    pre {
      margin: 0;
    }
    #sheetEmbed {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 4px;
      display: block;
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <header class="page-header">
    <h1>Cryptogram Generator</h1>
    <button type="button" id="viewToggleBtn" class="header-btn" onclick="toggleGeneratorSheetView()" aria-pressed="false">Sheet only</button>
  </header>

  <div id="generatorPanel" class="generator-panel">
  <input type="text" id="inputString" placeholder="Enter your phrase..." />
  <button onclick="generateCryptogram()">Generate</button>
  <button onclick="copyToClipboard('cryptogram')">📋 Copy Number Cryptogram</button>
  <button onclick="copyToClipboard('letterCryptogram')">📋 Copy Letter Cryptogram</button>
  <button onclick="sendToGoogleSheet()">📊 Send to Google Sheet</button>

  <div class="output">
    <h3>Cryptogram (Number Mapping):</h3>
    <div id="cryptogram" class="cryptogram"></div>

    <h3>Answer Key:</h3>
    <div id="answerKey" class="answer"></div>

    <h3>Key (Letter → Number):</h3>
    <div id="key" class="key"></div>

    <h3>Cryptogram (Letter-to-Letter Mapping):</h3>
    <div id="letterCryptogram" class="cryptogram"></div>

    <h3>Letter-to-Letter Key:</h3>
    <div id="letterMap" class="key"></div>
  </div>
  </div>

  <div id="sheetPanel" class="sheet-panel hidden" aria-hidden="true">
    <iframe id="sheetEmbed" title="CryptG log spreadsheet"></iframe>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/playsimple.in/s/AKfycbwvhnemiXLAd3Fa98u53lZU_2T3djrp91hYhL8MSMPxGPEWzPbL9qHdlE8XxyXgGu1v/exec';
const SPREADSHEET_ID = '1xPJb0tK3bUakJ1y56it-MLbyEiakraXJmmr_mlsGBh0';
const SHEET_EMBED_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/edit?usp=sharing&embedded=true&gid=0`;

function ensureSheetEmbedLoaded() {
  const el = document.getElementById('sheetEmbed');
  if (el && !el.src) el.src = SHEET_EMBED_URL;
}

function toggleGeneratorSheetView() {
  const gen = document.getElementById('generatorPanel');
  const sheet = document.getElementById('sheetPanel');
  const btn = document.getElementById('viewToggleBtn');
  const shell = document.getElementById('mainContainer');

  const showSheetOnly = gen.classList.contains('hidden') === false;
  if (showSheetOnly) {
    gen.classList.add('hidden');
    sheet.classList.remove('hidden');
    sheet.setAttribute('aria-hidden', 'false');
    shell.classList.add('container--sheet-focus');
    btn.textContent = 'Show generator';
    btn.setAttribute('aria-pressed', 'true');
    ensureSheetEmbedLoaded();
  } else {
    gen.classList.remove('hidden');
    sheet.classList.add('hidden');
    sheet.setAttribute('aria-hidden', 'true');
    shell.classList.remove('container--sheet-focus');
    btn.textContent = 'Sheet only';
    btn.setAttribute('aria-pressed', 'false');
  }
}

function refreshSheetEmbed() {
  const el = document.getElementById('sheetEmbed');
  if (!el || !el.src) return;
  el.src = SHEET_EMBED_URL;
}

function generateCryptogram() {
  const input = document.getElementById("inputString").value.toUpperCase().trim();
  const output = document.getElementById("cryptogram");
  const keyOutput = document.getElementById("key");
  const answerOutput = document.getElementById("answerKey");
  const letterCryptogramOutput = document.getElementById("letterCryptogram");
  const letterMapOutput = document.getElementById("letterMap");

  if (!input) return alert("Please enter a phrase.");

  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const usedLetters = alphabet.split('');

  // Unique number mapping
  let numbers = Array.from({ length: 26 }, (_, i) => i + 1).sort(() => Math.random() - 0.5);
  const letterMap = {};
  usedLetters.forEach((letter, i) => {
    letterMap[letter] = numbers[i];
  });

  // Unique letter-to-letter mapping
  const shuffledAlphabet = alphabet.split('').sort(() => Math.random() - 0.5);
  const globalLetterMap = {};
  const availableTargets = [...shuffledAlphabet];
  for (let letter of usedLetters) {
    let target;
    do {
      target = availableTargets.pop();
    } while (target === letter || Object.values(globalLetterMap).includes(target));
    globalLetterMap[letter] = target;
  }

  // Keep all characters in one continuous line
  const cleanInput = input.replace(/[^A-Z\s]/g, '');
  
  // Generate number cryptogram in one line
  let topLine = '';
  let bottomLine = '';
  
  for (let char of cleanInput) {
    if (char === ' ') {
      topLine += '    '; // 4 spaces for space
      bottomLine += '    '; // 4 spaces for space
    } else {
      topLine += char.padStart(4, ' ');
      bottomLine += String(letterMap[char]).padStart(4, ' ');
    }
  }
  
  output.innerHTML = `<pre>${topLine}\n${bottomLine}</pre>`;

  // Generate letter-to-letter cryptogram in one line
  let letterTopLine = '';
  let letterBottomLine = '';
  
  for (let char of cleanInput) {
    if (char === ' ') {
      letterTopLine += '    '; // 4 spaces for space
      letterBottomLine += '    '; // 4 spaces for space
    } else {
      letterTopLine += char.padStart(4, ' ');
      letterBottomLine += globalLetterMap[char].padStart(4, ' ');
    }
  }
  
  letterCryptogramOutput.innerHTML = `<pre>${letterTopLine}\n${letterBottomLine}</pre>`;

  // Answer Key
  const uniqueLetters = Array.from(new Set(input.replace(/[^A-Z]/g, '').split('')));
  const answerKeySingles = uniqueLetters.map(l => `${l} → ${letterMap[l]}`);
  
  // Single line answer for the whole phrase
  const phraseAnswer = cleanInput.split('').map(c => c === ' ' ? ' ' : letterMap[c]).join(' ');
  const fullAnswer = `${cleanInput} → ${phraseAnswer}`;
  
  answerOutput.textContent = [...answerKeySingles, fullAnswer].join('\n');

  // Letter-to-letter key
  const letterKeySingles = uniqueLetters.map(l => `${l} → ${globalLetterMap[l]}`);
  
  // Single line answer for letter mapping
  const letterPhraseAnswer = cleanInput.split('').map(c => c === ' ' ? ' ' : globalLetterMap[c]).join(' ');
  const fullLetterAnswer = `${cleanInput} → ${letterPhraseAnswer}`;
  
  letterMapOutput.textContent = [...letterKeySingles, fullLetterAnswer].join('\n');

  // Full A–Z key
  keyOutput.textContent = alphabet.split('').map(l => `${l} → ${letterMap[l]}`).join('\n');
}

function copyToClipboard(id) {
  const element = document.getElementById(id);
  const pre = element.querySelector('pre');
  const text = pre ? pre.innerText : element.innerText;

  navigator.clipboard.writeText(text)
    .then(() => {
      alert(`Copied ${id.includes("letter") ? 'Letter' : 'Number'} Cryptogram to clipboard!`);
    })
    .catch(err => {
      alert('Failed to copy text: ' + err);
    });
}

async function sendToGoogleSheet() {
  const cryptogramEl = document.getElementById('cryptogram');
  const letterCryptogramEl = document.getElementById('letterCryptogram');

  const numPre = cryptogramEl.querySelector('pre');
  const letterPre = letterCryptogramEl.querySelector('pre');

  if (!numPre || !letterPre) {
    return alert('Please generate a cryptogram first.');
  }

  const phrase = document.getElementById('inputString').value.toUpperCase().trim();
  const numberCryptogram = numPre.innerText;
  const letterCryptogram = letterPre.innerText;

  try {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = APPS_SCRIPT_URL;
    form.target = 'hidden_iframe';

    const fields = { phrase, numberCryptogram, letterCryptogram };
    for (const [key, value] of Object.entries(fields)) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = value;
      form.appendChild(input);
    }

    let iframe = document.getElementById('hidden_iframe');
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.name = 'hidden_iframe';
      iframe.id = 'hidden_iframe';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
    }

    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);
    refreshSheetEmbed();
    alert('Sent to Google Sheet!');
  } catch (err) {
    alert('Failed to send: ' + err.message);
  }
}
</script>

</body>
</html>
